[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threat-model-as-code"
version = "1.0.0"
description = "STRIDE threat modelling from a YAML model: conditional enumeration, explainable risk scoring, generated diagrams and backlog, and a drift check that fails CI when the model stops matching the code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vincent Plessy" }]
keywords = ["threat-modeling", "stride", "security", "appsec", "shift-left", "devsecops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = ["PyYAML>=5.4", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]

[project.scripts]
tmac = "tmac.cli:main"

[project.urls]
Homepage = "https://github.com/Vincent-P-essy/threat-model-as-code"

[tool.hatch.build.targets.wheel]
packages = ["src/tmac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
